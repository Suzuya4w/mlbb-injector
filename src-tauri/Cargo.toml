[package]
name = "mlbb-injector"
version = "1.2.1"
description = "A high-performance cyberpunk-themed desktop application built with Tauri (Rust + SolidJS) to seamlessly manage Mobile Legends assets directly via ADB."
authors = ["Suzuya4w"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mlbb_injector_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.18"
walkdir = "2.5.0"
tauri-plugin-dialog = "2"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
scraper = "0.27.0"
fs_extra = "1.3.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

